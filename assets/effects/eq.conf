# Three-band stereo equalizer. wet/dry controls provide bypass without rerouting.
filter.graph = {
    nodes = [
        { type=builtin name=input label=copy }
        { type=builtin name=bass label=bq_lowshelf control={ Freq=120 Q=0.707 Gain=0 } }
        { type=builtin name=mid label=bq_peaking control={ Freq=1000 Q=1 Gain=0 } }
        { type=builtin name=treble label=bq_highshelf control={ Freq=6000 Q=0.707 Gain=0 } }
        { type=builtin name=wet label=linear control={ Mult=1 Add=0 } }
        { type=builtin name=dry label=linear control={ Mult=0 Add=0 } }
        { type=builtin name=mix label=mixer control={ "Gain 1"=1 "Gain 2"=1 } }
    ]
    links = [
        { output="input:Out" input="bass:In" }
        { output="bass:Out" input="mid:In" }
        { output="mid:Out" input="treble:In" }
        { output="treble:Out" input="wet:In" }
        { output="input:Out" input="dry:In" }
        { output="wet:Out" input="mix:In 1" }
        { output="dry:Out" input="mix:In 2" }
    ]
    inputs = [ "input:In" ]
    outputs = [ "mix:Out" ]
}
