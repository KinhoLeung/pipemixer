# Stereo voice chain: high-pass, noise gate, presence EQ, and wet/dry bypass.
filter.graph = {
    nodes = [
        { type=builtin name=input label=copy }
        { type=builtin name=highpass label=bq_highpass control={ Freq=80 Q=0.707 } }
        # PipeWire 1.6.8 clamps the gate's unconnected NaN Level sentinel to 0.
        # A control-only 0*log(0) restores NaN and enables its audio detector.
        { type=builtin name=autolevel label=log control={ M2=0 } }
        { type=builtin name=gate label=noisegate control={ "Open Threshold"=0.006 "Close Threshold"=0.003 } }
        { type=builtin name=presence label=bq_peaking control={ Freq=2500 Q=1 Gain=2 } }
        { type=builtin name=wet label=linear control={ Mult=1 Add=0 } }
        { type=builtin name=dry label=linear control={ Mult=0 Add=0 } }
        { type=builtin name=mix label=mixer control={ "Gain 1"=1 "Gain 2"=1 } }
    ]
    links = [
        { output="input:Out" input="highpass:In" }
        { output="highpass:Out" input="gate:In" }
        { output="autolevel:Notify" input="gate:Level" }
        { output="gate:Out" input="presence:In" }
        { output="presence:Out" input="wet:In" }
        { output="input:Out" input="dry:In" }
        { output="wet:Out" input="mix:In 1" }
        { output="dry:Out" input="mix:In 2" }
    ]
    inputs = [ "input:In" ]
    outputs = [ "mix:Out" ]
}
